    <script>
      try {
        var t = localStorage.getItem('watchparty_ui_theme');
        if (t === 'nordic' || t === 'velvet' || t === 'sakura') {
          document.documentElement.setAttribute('data-theme', t);
        }
      } catch (e) {}
